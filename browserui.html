<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="html/style.css">
    <link rel="stylesheet" href="browser.css">
    <title>Zerolfie Web - Browser UI</title>
    <script src="browser.js"></script>
</head>
<body>
    <nav class="addressbar">
        <button id="go-back-button" class="btn">
            ⬅️
        </button>
        <button id="go-foward-button" class="btn">
            ➡️
        </button>
        <button id="refresh-button" class="btn">
            🔄
        </button>
        <button id="home-button" class="btn">
            🏠
        </button>
        <input type="text" id="url-textbox" class="textbox" placeholder="Enter a URL here..." />
        <button id="go-btn" class="btn">Go</button>
    </nav>
    <main>
        <iframe id="browser-content" zlf-disable-crossorigin-checks></iframe>
    </main>
</body>
</html>
